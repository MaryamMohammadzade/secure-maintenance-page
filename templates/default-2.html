<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>به‌زودی برمی‌گردیم | {{site_name}}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Vazirmatn,"IRANSans",Tahoma,"Segoe UI",sans-serif;color:#e5e7eb;background:radial-gradient(circle at 20% 20%,#1e3a8a 0,transparent 45%),radial-gradient(circle at 80% 80%,#6d28d9 0,transparent 45%),#0b1020;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.9;overflow:hidden}
  .wrap{max-width:640px;width:100%;text-align:center;padding:48px 32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.04);backdrop-filter:blur(8px)}
  .gears{position:relative;width:120px;height:90px;margin:0 auto 28px}
  .gear{position:absolute;border-radius:50%;border:10px dashed #60a5fa}
  .g1{width:70px;height:70px;top:0;right:0;animation:spin 6s linear infinite}
  .g2{width:46px;height:46px;bottom:0;left:6px;border-color:#a78bfa;animation:spin 4s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .site{font-size:14px;letter-spacing:.5px;color:#93c5fd;margin-bottom:8px}
  h1{font-size:30px;color:#fff;margin-bottom:14px}
  p{color:#cbd5e1;font-size:16px}
  .dots{margin-top:28px}
  .dots span{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:#60a5fa;animation:pulse 1.4s ease-in-out infinite}
  .dots span:nth-child(2){animation-delay:.2s;background:#818cf8}
  .dots span:nth-child(3){animation-delay:.4s;background:#a78bfa}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  footer{margin-top:28px;font-size:13px;color:#64748b}
</style>
</head>
<body>
  <main class="wrap">
    <div class="gears" aria-hidden="true"><div class="gear g1"></div><div class="gear g2"></div></div>
    <div class="site">{{site_name}}</div>
    <h1>در حال تعمیر و نگهداری هستیم</h1>
    <p>سایت به‌صورت موقت برای ارتقا در دسترس نیست. تیم ما در حال کار است و خیلی زود با امکانات بهتر بازمی‌گردیم.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <footer>© {{year}} {{site_name}}</footer>
  </main>
</body>
</html>
